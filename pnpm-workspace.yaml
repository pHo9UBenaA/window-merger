packages:
  - .

allowBuilds:
  esbuild: true

blockExoticSubdeps: true

catalog:
  '@biomejs/biome': 2.5.5
  '@commitlint/cli': 21.0.1
  '@commitlint/config-conventional': 21.0.1
  '@playwright/test': 1.63.0
  '@secretlint/secretlint-rule-preset-recommend': 13.0.2
  '@types/chrome': 0.1.42
  '@types/node': 25.9.1
  '@typescript/native-preview': 7.0.0-dev.20260603.1
  '@vitest/coverage-v8': 4.1.11
  esbuild: 0.28.1
  secretlint: 13.0.2
  typescript: 6.0.3
  vitest: 4.1.11

# Patched transitive dependencies; keep audit clean with time-based resolution.
overrides:
  'vite>esbuild': 0.28.1
  vite: 7.3.5
  postcss: 8.5.23
  nanoid: 3.3.18
  js-yaml: 4.3.2
  fast-uri: 3.1.8

catalogMode: strict

cleanupUnusedCatalogs: true

engineStrict: true

frozenLockfile: true

linkWorkspacePackages: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # Security patches newer than the time-based transitive resolution cutoff.
  - 'fast-uri@3.1.8'
  - 'js-yaml@4.3.2'
  - typescript
  - '@typescript/native-preview'
  - '@typescript/native-preview-*'

pmOnFail: error

preferWorkspacePackages: true

resolutionMode: time-based

savePrefix: ''

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade
