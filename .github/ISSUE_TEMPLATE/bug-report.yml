name: Bug Report

description: Create a report about a bug you experienced while using Window Merger.

title: "[Bug] Replace with title"

labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Place a brief description in the title of this report.

        Thank you for taking the time to report this bug.
  - type: dropdown
    attributes:
      label: Reproduction in a fresh profile
      description: Testing with only Window Merger installed is useful, but is not required to report a state-dependent bug.
      options:
        - Reproduces in a fresh profile
        - Only reproduces in my existing profile
        - Not tested or cannot test safely
    validations:
      required: true

  - type: textarea
    attributes:
      label: Browser state and trigger
      description: Include toolbar/shortcut/menu, normal/incognito mode, approximate window/tab counts, pinned tabs, groups, and relevant other extensions. Do not include private URLs or upload your browser profile.

  - type: textarea
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of this bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Provide steps to reproduce this bug.
      placeholder: |
        1. [First Step]
        2. [Second Step]
        3. [and so on...]
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System
    validations:
      required: true

  - type: input
    attributes:
      label: Web Browser name and version
    validations:
      required: true

  - type: input
    attributes:
      label: Window Merger version
    validations:
      required: true
