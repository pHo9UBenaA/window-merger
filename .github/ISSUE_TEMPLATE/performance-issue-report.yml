name: Performance Issue Report

description: Create a report about a performance issue you experienced while using Window Merger.

title: "[Performance Issue] Replace with title"

labels: ["performance-issue"]

body:
  - type: markdown
    attributes:
      value: |
        Place a brief description in the title of this report.

        Thank you for taking the time to report this performance issue.
  - type: dropdown
    attributes:
      label: Reproduction in a fresh profile
      description: Existing-profile and large-session problems are welcome even if a fresh profile does not reproduce them.
      options:
        - Reproduces in a fresh profile
        - Only reproduces in my existing profile
        - Not tested or cannot test safely
    validations:
      required: true

  - type: textarea
    attributes:
      label: Workload and checks performed
      description: Include toolbar/shortcut/menu, normal/incognito mode, window/tab/group counts, elapsed time, other extensions, and whether restarting helped. Do not include private URLs or upload your browser profile.

  - type: textarea
    attributes:
      label: Performance Issue Description
      description: Provide a clear and concise description of this performance issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Provide steps to reproduce this performance issue.
      placeholder: |
        1. [First Step]
        2. [Second Step]
        3. [and so on...]
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System
    validations:
      required: true

  - type: input
    attributes:
      label: Web Browser name and version
    validations:
      required: true

  - type: input
    attributes:
      label: Window Merger version
    validations:
      required: true
