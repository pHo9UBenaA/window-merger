name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stress:
        description: Run the larger browser test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --reporter=github
      - run: pnpm run check:secrets
      - run: pnpm run typecheck
      - run: pnpm run typecheck:tsc
      - run: pnpm run test:coverage
      - run: pnpm audit
      - run: pnpm run zip
      - name: Validate release branch version
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          RELEASE_COMMIT: HEAD
        run: node --experimental-strip-types scripts/release.ts --check
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: pnpm run test:browser
      - if: github.event_name == 'workflow_dispatch' && inputs.stress
        run: pnpm run test:stress
