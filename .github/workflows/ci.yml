name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stress:
        description: Run the larger browser test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Verify workflow dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.2.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm scripts:check
      - run: pnpm run ci --reporter=github
      - run: pnpm run check:secrets
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run check:dependencies
      - run: pnpm run zip
      - name: Validate package and extension versions
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          RELEASE_COMMIT: HEAD
        run: pnpm release:check
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: pnpm run test:browser
      - if: github.event_name == 'workflow_dispatch' && inputs.stress
        run: pnpm run test:stress
