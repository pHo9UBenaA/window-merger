name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

# Distinct merges must not cancel each other's release work.
concurrency:
  group: tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to push the verified release tag.
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.2.0
        with:
          run_install: false
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate and create the pnpm release tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          pnpm --silent --config.verifyDepsBeforeRun=false run release:publish
