name: Browser matrix

# Manual verification of the packaged extension. Not part of the pull request gate:
# `checks` still runs the browser suite on ubuntu-latest, and this workflow can be
# dispatched on demand before a release or when investigating a platform difference.

on:
  workflow_dispatch:
    inputs:
      stress:
        description: Also run the 200-tab stress test
        type: boolean
        default: false

permissions: {}

# A dispatched rerun must finish; do not let a newer push cancel it.
concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    name: browser (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.2.0
        with:
          run_install: false
      - if: runner.os == 'Windows'
        run: choco install zip unzip --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: pnpm run test:browser
      - if: inputs.stress
        run: pnpm run test:stress
      - if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: browser-${{ matrix.os }}
          path: test-results

  plan:
    name: plan compatibility matrix
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.2.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: |
          matrix=$(pnpm --silent run chrome:matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  compatibility:
    name: compatibility (${{ matrix.os }}, Chrome ${{ matrix.major }})
    permissions:
      contents: read
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4.2.0
        with:
          run_install: false
      - if: runner.os == 'Windows'
        run: choco install zip unzip --no-progress -y
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm chrome:install "$CHROME_MAJOR" "$CHROME_PLATFORM"
        env:
          CHROME_MAJOR: ${{ matrix.major }}
          CHROME_PLATFORM: ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:browser:compat
      - if: runner.os != 'Linux'
        run: pnpm test:browser:compat
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.major }}
          path: test-results

  gate:
    name: compatibility-gate
    permissions: {}
    needs: [browser, plan, compatibility]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          [[ "$BROWSER_RESULT" == success ]]
          [[ "$PLAN_RESULT" == success ]]
          [[ "$COMPATIBILITY_RESULT" == success ]]
